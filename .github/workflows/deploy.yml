# Builds the MVC app + Web API and deploys it to Azure App Service (mems-hh) on every push to main.
# Secrets: AZURE_WEBAPP_PUBLISH_PROFILE (publish profile XML of the web app).
# Runtime configuration (connection string, JWT key, upload path) lives in the App Service app settings,
# and appsettings.Development.json is git-ignored, so no secrets are part of the build.
name: Build and deploy to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mems-hh
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: MunicipalElections/MunicipalElections.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ runner.temp }}/app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}/app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app
